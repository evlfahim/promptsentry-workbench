<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptSentry Workbench</title>
    <style>
      body {
        margin: 0;
        background-color: var(--bg, #0d0d1a);
        color: var(--text, #e0e0e0);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: background-color 0.2s, color 0.2s;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * { box-sizing: border-box; }
      ::selection { background: var(--selection, rgba(74,158,255,0.3)); }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar, #2d2d44); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--scrollbarHover, #3d3d5c); }
      @media (max-width: 768px) {
        .nav-links-desktop { display: none !important; }
        .mobile-menu-btn { display: block !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
