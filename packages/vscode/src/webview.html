<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'unsafe-inline'; img-src {{cspSource}} data:;">
  <title>PromptSentry Workbench</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: var(--vscode-editor-background, #0d0d1a);
      color: var(--vscode-editor-foreground, #e0e0e0);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow-x: hidden;
    }
    #root {
      min-height: 100vh;
    }
    /* Loading state before React mounts */
    .loading-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: var(--vscode-editor-background, #0d0d1a);
      color: var(--vscode-editor-foreground, #e0e0e0);
      font-size: 18px;
    }
    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--vscode-input-border, #3c3c3c);
      border-top-color: var(--vscode-button-background, #007acc);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-overlay">
      <div class="loading-spinner"></div>
      Loading PromptSentry Workbench...
    </div>
  </div>
  <script>
    // Pass CSP source to the app
    window.__VSCODE_CSP_SOURCE__ = "{{cspSource}}";
  </script>
  <script type="module" src="/webview-bridge.ts"></script>
  <script type="module" src="/webview-app.tsx"></script>
</body>
</html>
