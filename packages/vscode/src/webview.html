<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'unsafe-inline'; img-src {{cspSource}} data:;">
  <title>PromptSentry Workbench</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg, #0d0d1a);
      color: var(--text, #e0e0e0);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow-x: hidden;
      transition: background-color 0.2s, color 0.2s;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    * { box-sizing: border-box; }
    ::selection { background: var(--selection, rgba(74,158,255,0.3)); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar, #2d2d44); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbarHover, #3d3d5c); }
    #root { min-height: 100vh; }
    /* Loading state before React mounts */
    .loading-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: var(--bg, #0d0d1a);
      color: var(--text, #e0e0e0);
      font-size: 18px;
    }
    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border, #3c3c3c);
      border-top-color: var(--accent, #007acc);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Responsive: stack diff side-by-side on narrow screens */
    @media (max-width: 600px) {
      .diff-side-by-side-mobile {
        grid-template-columns: 1fr !important;
      }
      .diff-side-by-side-mobile > div:first-child {
        border-right: none !important;
        border-bottom: 1px solid var(--border, #2d2d44) !important;
      }
      .comparison-stack-mobile {
        grid-template-columns: 1fr !important;
      }
      .comparison-stack-mobile > * {
        grid-column: 1 !important;
      }
    }
    /* Focus visible for accessibility */
    :focus-visible {
      outline: 2px solid var(--accent, #4a9eff);
      outline-offset: 2px;
    }
    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-overlay">
      <div class="loading-spinner"></div>
      Loading PromptSentry Workbench...
    </div>
  </div>
  <script>
    window.__VSCODE_CSP_SOURCE__ = "{{cspSource}}";
  </script>
  <script type="module" src="/webview-bridge.ts"></script>
  <script type="module" src="/webview-app.tsx"></script>
</body>
</html>
